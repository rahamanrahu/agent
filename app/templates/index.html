<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>

<!-- Modern Clean Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #070709;
    --card-bg: rgba(22, 22, 28, 0.65);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.35);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(at 10% 15%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 85%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    overflow: hidden;
}

/* Glassmorphism Card Container */
.card {
    position: relative;
    width: 360px;
    padding: 44px 32px 36px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 36px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
}

.brand-badge span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
}

.card h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}

.card p {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-bottom: 36px;
}

/* Mic Button Styling & Ambient Glow */
.mic-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 4px auto 30px;
}

.mic {
    width: 86px;
    height: 86px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    font-size: 32px;
    cursor: pointer;
    background: linear-gradient(145deg, #1e1e28, #111116);
    box-shadow: 
        0 10px 24px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                box-shadow 0.3s ease, 
                border-color 0.3s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.mic:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.03);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 
        0 14px 28px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
}

.mic:active:not(:disabled) {
    transform: scale(0.96);
}

.mic:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1);
}

/* Pulsing Wave when Active */
.listening {
    transform: scale(1.08) !important;
    border-color: var(--accent) !important;
    background: linear-gradient(145deg, #242438, #151520) !important;
    box-shadow: 
        0 0 0 8px rgba(99, 102, 241, 0.15),
        0 0 0 18px rgba(99, 102, 241, 0.08),
        0 0 35px var(--accent-glow) !important;
    animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
}

@keyframes pulse-ring {
    0%, 100% {
        box-shadow: 
            0 0 0 8px rgba(99, 102, 241, 0.2),
            0 0 0 18px rgba(99, 102, 241, 0.08),
            0 0 35px var(--accent-glow);
    }
    50% {
        box-shadow: 
            0 0 0 12px rgba(99, 102, 241, 0.25),
            0 0 0 28px rgba(99, 102, 241, 0.04),
            0 0 45px var(--accent-glow);
    }
}

/* Dynamic Status Feedback */
.status {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
    min-height: 20px;
    transition: color 0.2s ease;
}

/* Floating Song Chip */
.song {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 8px 14px;
    display: inline-block;
    max-width: 90%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    empty-cells: hide;
}

.song:empty {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="brand-badge">
        <span></span> Voice Player
    </div>

    <h2>Nova AI</h2>

    <p>Say a song name</p>

    <div class="mic-wrapper">
        <button id="mic" class="mic">
            🎙️
        </button>
    </div>

    <div id="status" class="status">
        Tap microphone
    </div>

    <div id="song" class="song"></div>

</div>

<script>

const mic=document.getElementById("mic");
const status=document.getElementById("status");
const song=document.getElementById("song");

const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let youtubeTab=null;
let listening=false;

if(!SpeechRecognition){

    status.textContent=
        "Speech recognition unavailable";

    mic.disabled=true;

}else{

    const recognition=
        new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    recognition.onstart=()=>{

        listening=true;

        mic.classList.add("listening");

        status.textContent=
            "Listening...";

    };

    recognition.onend=()=>{

        listening=false;

        mic.classList.remove("listening");

    };

    recognition.onerror=()=>{

        listening=false;

        mic.classList.remove("listening");

        status.textContent="Try again";

    };

    recognition.onresult=async(event)=>{

        const command=
            event.results[0][0]
            .transcript
            .trim();

        if(!command){

            status.textContent=
                "No song detected";

            return;

        }

        song.textContent=command;

        status.textContent=
            "Finding song...";

        try{

            const response=
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            command:command
                        })
                    }
                );

            const data=
                await response.json();

            if(!data.success){

                status.textContent=
                    data.message ||
                    "Song not found";

                return;

            }

            if(!youtubeTab ||
               youtubeTab.closed){

                youtubeTab=
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            }else{

                youtubeTab.location.href=
                    data.url;

                youtubeTab.focus();

            }

            status.textContent="Playing";

        }catch(error){

            console.error(error);

            status.textContent=
                "Server connection failed";

        }

    };

    mic.onclick=()=>{

        if(listening)
            return;

        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    };

}

</script>

</body>
</html>
