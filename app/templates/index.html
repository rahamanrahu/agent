<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Nova AI</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --primary: #8b5cf6;
    --primary-glow: rgba(139, 92, 246, 0.45);
    --primary-bright: #a78bfa;
    --accent-cyan: #06b6d4;
    --accent-pink: #ec4899;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-faint: #475569;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    background-color: #060813;
    overflow-x: hidden;
    position: relative;
}

/* Luxury Multi-Layer Ambient Background */
.bg-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    animation: drift 16s ease-in-out infinite alternate;
}

.orb-1 {
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, #6366f1, transparent 70%);
    top: -100px;
    left: 20%;
}

.orb-2 {
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, #ec4899, transparent 70%);
    bottom: -80px;
    right: 15%;
    animation-delay: -6s;
}

.orb-3 {
    width: 360px;
    height: 360px;
    background: radial-gradient(circle, #06b6d4, transparent 70%);
    top: 40%;
    left: -80px;
    animation-delay: -10s;
}

@keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 30px) scale(1.1); }
}

/* Glassmorphism Card Container */
.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 40px 32px;
    text-align: center;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    backdrop-filter: blur(36px);
    -webkit-backdrop-filter: blur(36px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 80px -20px rgba(139, 92, 246, 0.25);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--primary-bright);
    margin-bottom: 14px;
}

.badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
}

h2 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.8px;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 75%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

p.subtitle {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 30px;
    font-weight: 400;
}

/* Microphone Area */
.mic-wrapper {
    position: relative;
    display: inline-block;
    margin: 8px 0 16px;
}

.mic {
    width: 86px;
    height: 86px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 50%;
    font-size: 34px;
    cursor: pointer;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
    display: grid;
    place-items: center;
    box-shadow: 
        0 14px 28px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 2;
    outline: none;
}

.mic:hover {
    transform: translateY(-3px) scale(1.04);
    border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 
        0 20px 36px rgba(0, 0, 0, 0.5),
        0 0 35px var(--primary-glow);
}

.mic:active {
    transform: scale(0.95);
}

/* Glowing Pulse Animation */
.mic.listening {
    background: linear-gradient(145deg, #6d28d9, #4c1d95);
    border-color: #a78bfa;
    box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
    animation: pulseRing 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
}

@keyframes pulseRing {
    0% {
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
    }
    70% {
        box-shadow: 0 0 0 30px rgba(139, 92, 246, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
    }
}

.status {
    margin: 12px 0 6px;
    color: var(--primary-bright);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.command {
    min-height: 22px;
    margin: 4px 0 14px;
    color: #e2e8f0;
    font-size: 14px;
    font-style: italic;
    opacity: 0.9;
}

/* Modern Gmail Editor View */
.editor {
    display: none;
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    text-align: left;
    animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeInSlide {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.recipient {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 2px;
}

input,
textarea {
    width: 100%;
    margin: 8px 0;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 14px;
    background: rgba(10, 14, 26, 0.75);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s ease;
}

input::placeholder,
textarea::placeholder {
    color: var(--text-faint);
}

input:focus,
textarea:focus {
    border-color: var(--primary);
    background: rgba(12, 17, 34, 0.95);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
}

textarea {
    height: 125px;
    resize: vertical;
    line-height: 1.55;
}

/* Buttons */
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

button.action {
    flex: 1;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    transition: all 0.25s ease;
}

button.action:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    transform: translateY(-1px);
}

button.action.primary {
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    border: none;
    color: #ffffff;
    box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
}

button.action.primary:hover {
    background: linear-gradient(135deg, #9333ea 0%, #4f46e5 100%);
    box-shadow: 0 10px 24px -2px rgba(99, 102, 241, 0.65);
}

button.action:active {
    transform: translateY(1px);
}

</style>

</head>


<body>

<!-- Ambient background shapes -->
<div class="bg-scene">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
</div>

<div class="card">

    <div class="badge">
        <span class="badge-dot"></span>
        Voice Assistant
    </div>

    <h2>Nova AI</h2>

    <p class="subtitle">
        Say a song name or create an email
    </p>

    <div class="mic-wrapper">
        <button
            id="mic"
            class="mic"
        >
            🎙️
        </button>
    </div>

    <div
        id="status"
        class="status"
    >
        Tap microphone
    </div>

    <div
        id="command"
        class="command"
    ></div>

    <!-- Gmail Editor -->
    <div
        id="editor"
        class="editor"
    >

        <div
            id="recipient"
            class="recipient"
        ></div>

        <input
            id="subject"
            placeholder="Email subject"
        >

        <textarea
            id="body"
            placeholder="Email body"
        ></textarea>

        <div class="btn-group">
            <button
                id="open"
                class="action primary"
            >
                Open in Gmail
            </button>

            <button
                id="regen"
                class="action"
            >
                Regenerate
            </button>
        </div>

    </div>

</div>


<script>


// --------------------------------------------------
// DOM REFERENCES
// --------------------------------------------------

const $ =
    id => document.getElementById(id);


const mic =
    $("mic");


const status =
    $("status");


const commandBox =
    $("command");


const editor =
    $("editor");


const recipient =
    $("recipient");


const subject =
    $("subject");


const body =
    $("body");



// --------------------------------------------------
// SPEECH RECOGNITION
// --------------------------------------------------

const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition;

let listening = false;



// --------------------------------------------------
// COMMAND STATE
// --------------------------------------------------

let lastCommand = "";


// Prevent duplicate email generation

let emailGenerated = false;


// Prevent multiple requests at the same time

let generatingEmail = false;


// YouTube tab

let youtubeTab = null;



// --------------------------------------------------
// SPEECH RECOGNITION SETUP
// --------------------------------------------------

if(!SR){

    status.textContent =
        "Speech recognition unavailable";

    mic.disabled = true;

}
else{

    recognition =
        new SR();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "Listening...";

    };



    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    recognition.onerror = e => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

        status.textContent =
            "Voice error: " +
            e.error;

    };



    recognition.onresult = e => {

        const text =
            e.results[0][0]
            .transcript
            .trim();


        if(!text){

            status.textContent =
                "No command detected";

            return;

        }


        lastCommand =
            text;


        commandBox.textContent =
            text;


        processCommand(
            text
        );

    };



    mic.onclick = () => {

        if(listening)
            return;


        try{

            recognition.start();

        }
        catch(e){

            console.log(e);

        }

    };

}



// --------------------------------------------------
// GMAIL KEYWORD DETECTION
// --------------------------------------------------
//
// Gmail requires BOTH:
//
// create
// email
//
// Examples:
//
// "create email for my boss"
// "create an email for my manager"
//
// --------------------------------------------------

function isGmail(command){

    const hasCreate =
        /\bcreate\b/i.test(command);


    const hasEmail =
        /\bemail\b/i.test(command);


    return (
        hasCreate &&
        hasEmail
    );

}



// --------------------------------------------------
// YOUTUBE KEYWORD DETECTION
// --------------------------------------------------
//
// YouTube requires:
//
// play
//
// OR
//
// song
//
// Examples:
//
// "play believer"
// "play a song"
// "song believer"
//
// --------------------------------------------------

function isYouTube(command){

    return (
        /\bplay\b/i.test(command) ||
        /\bsong\b/i.test(command)
    );

}



// --------------------------------------------------
// MAIN COMMAND PROCESSOR
// --------------------------------------------------

async function processCommand(command){


    // ----------------------------------------------
    // CHECK COMMAND TYPE
    // ----------------------------------------------

    const gmail =
        isGmail(command);


    const youtube =
        isYouTube(command);



    // ----------------------------------------------
    // GMAIL COMMAND
    // ----------------------------------------------

    if(gmail){

        // Prevent duplicate generation

        if(generatingEmail){

            status.textContent =
                "Email is already being generated...";

            return;

        }


        // Prevent the same command from generating
        // another email

        if(
            emailGenerated &&
            command === lastCommand
        ){

            status.textContent =
                "Email already generated.";

            return;

        }


        generatingEmail = true;


        status.textContent =
            "Generating email...";


        try{


            const response =
                await fetch(
                    "/agent",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );



            const data =
                await response.json();



            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "Email request failed"
                );

            }



            // Show ONE generated email

            showEmail(
                data
            );


            emailGenerated = true;


        }
        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "Email generation failed";

        }
        finally{

            generatingEmail = false;

        }


        return;

    }



    // ----------------------------------------------
    // YOUTUBE COMMAND
    // ----------------------------------------------

    else if(youtube){

        status.textContent =
            "Finding song...";


        try{


            const response =
                await fetch(
                    "/youtube/play",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );



            const data =
                await response.json();



            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "YouTube request failed"
                );

            }



            playYouTube(
                data
            );


        }
        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "YouTube request failed";

        }


        return;

    }



    // ----------------------------------------------
    // UNKNOWN COMMAND
    // ----------------------------------------------

    else{

        status.textContent =
            "Please say 'create email' or 'play song'.";

        return;

    }

}



// --------------------------------------------------
// SHOW GENERATED EMAIL
// --------------------------------------------------

function showEmail(data){


    recipient.dataset.email =
        data.recipient || "";


    recipient.textContent =
        data.recipient
        ? "To: " + data.recipient
        : "Recipient not specified";


    subject.value =
        data.subject || "";


    body.value =
        data.body || "";


    editor.style.display =
        "block";


    status.textContent =
        "Email ready. Review or edit it.";

}



// --------------------------------------------------
// OPEN GMAIL
// --------------------------------------------------

$("open").onclick = () => {


    const url =
        "https://mail.google.com/mail/u/0/?" +

        new URLSearchParams({

            view:"cm",

            fs:"1",

            to:
                recipient.dataset.email || "",

            su:
                subject.value,

            body:
                body.value

        });



    const win =
        window.open(
            url,
            "NovaGmail"
        );



    if(!win){

        status.textContent =
            "Please allow popups for this site.";

    }

};



// --------------------------------------------------
// REGENERATE BUTTON
// --------------------------------------------------
//
// No automatic second generation.
//
// Clicking this button also does NOT call /agent.
// --------------------------------------------------

$("regen").onclick = () => {

    status.textContent =
        "Email already generated. Edit the existing email.";

};



// --------------------------------------------------
// YOUTUBE PLAYBACK
// --------------------------------------------------

function playYouTube(data){


    if(
        !youtubeTab ||
        youtubeTab.closed
    ){

        youtubeTab =
            window.open(
                data.url,
                "NovaYouTube"
            );

    }
    else{

        youtubeTab.location.href =
            data.url;

        youtubeTab.focus();

    }


    status.textContent =
        "Playing";

}


</script>


</body>

</html>
