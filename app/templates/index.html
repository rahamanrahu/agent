<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #050508;
    --card-bg: rgba(14, 14, 20, 0.72);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --accent: #818cf8;
    --accent-glow: rgba(129, 140, 248, 0.45);
    --accent-secondary: #c084fc;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
}

/* Atmospheric ambient aurora glow */
body::before,
body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: drift 14s ease-in-out infinite alternate;
}

body::before {
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
    top: 10%;
    left: 15%;
}

body::after {
    width: 440px;
    height: 440px;
    background: radial-gradient(circle, #a855f7 0%, rgba(168, 85, 247, 0) 70%);
    bottom: 10%;
    right: 15%;
    animation-duration: 18s;
}

@keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 30px) scale(1.12); }
}

/* Glassmorphism Card Container */
.card {
    position: relative;
    z-index: 1;
    width: 370px;
    padding: 44px 32px 38px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 40px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow: 
        0 30px 60px -20px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 0 20px rgba(255, 255, 255, 0.02);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Badge styling */
.brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    margin-bottom: 22px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
}

.brand-badge span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    animation: status-blink 2.5s infinite ease-in-out;
}

@keyframes status-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
}

.card h2 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}

.card p {
    font-size: 13.5px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-bottom: 34px;
    letter-spacing: -0.01em;
}

/* Mic Interactive Controls */
.mic-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.mic {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
    background: radial-gradient(circle at 35% 25%, #252538 0%, #101017 100%);
    box-shadow: 
        0 14px 28px -4px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

.mic-icon {
    width: 32px;
    height: 32px;
    fill: #f1f5f9;
    transition: transform 0.3s ease, fill 0.3s ease;
}

.mic:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.04);
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow: 
        0 20px 35px -5px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(99, 102, 241, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
}

.mic:hover:not(:disabled) .mic-icon {
    transform: scale(1.05);
    fill: #ffffff;
}

.mic:active:not(:disabled) {
    transform: scale(0.95);
}

.mic:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    filter: grayscale(1);
}

/* Dynamic Active Listening Ripple Animation */
.listening {
    transform: scale(1.06) !important;
    border-color: var(--accent) !important;
    background: radial-gradient(circle at 35% 25%, #2d2a54 0%, #121020 100%) !important;
    animation: radar-pulse 2s infinite cubic-bezier(0.2, 0, 0.3, 1);
}

.listening .mic-icon {
    fill: #ffffff !important;
    transform: scale(1.1);
}

@keyframes radar-pulse {
    0% {
        box-shadow: 
            0 0 0 0 rgba(129, 140, 248, 0.5),
            0 0 0 0 rgba(192, 132, 252, 0.3),
            0 0 30px var(--accent-glow);
    }
    50% {
        box-shadow: 
            0 0 0 14px rgba(129, 140, 248, 0.15),
            0 0 0 28px rgba(192, 132, 252, 0.05),
            0 0 45px var(--accent-glow);
    }
    100% {
        box-shadow: 
            0 0 0 22px rgba(129, 140, 248, 0),
            0 0 0 42px rgba(192, 132, 252, 0),
            0 0 30px var(--accent-glow);
    }
}

/* Status Label */
.status {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    min-height: 20px;
    transition: color 0.3s ease;
}

/* Song Badge Output */
.song {
    margin-top: 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: #e0e7ff;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 7px 16px;
    display: inline-block;
    max-width: 90%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
}

.song:empty {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <div class="brand-badge">
        <span></span> Voice Player
    </div>

    <h2>Nova AI</h2>

    <p>Say a song name</p>

    <div class="mic-wrapper">
        <button id="mic" class="mic" aria-label="Microphone">
            <!-- Modern Minimal SVG Icon -->
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
    </div>

    <div id="status" class="status">
        Tap microphone
    </div>

    <div id="song" class="song"></div>

</div>

<script>

const mic=document.getElementById("mic");
const status=document.getElementById("status");
const song=document.getElementById("song");

const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let youtubeTab=null;
let listening=false;

if(!SpeechRecognition){

    status.textContent=
        "Speech recognition unavailable";

    mic.disabled=true;

}else{

    const recognition=
        new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    recognition.onstart=()=>{

        listening=true;

        mic.classList.add("listening");

        status.textContent=
            "Listening...";

    };

    recognition.onend=()=>{

        listening=false;

        mic.classList.remove("listening");

    };

    recognition.onerror=()=>{

        listening=false;

        mic.classList.remove("listening");

        status.textContent="Try again";

    };

    recognition.onresult=async(event)=>{

        const command=
            event.results[0][0]
            .transcript
            .trim();

        if(!command){

            status.textContent=
                "No song detected";

            return;

        }

        song.textContent=command;

        status.textContent=
            "Finding song...";

        try{

            const response=
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            command:command
                        })
                    }
                );

            const data=
                await response.json();

            if(!data.success){

                status.textContent=
                    data.message ||
                    "Song not found";

                return;

            }

            if(!youtubeTab ||
               youtubeTab.closed){

                youtubeTab=
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            }else{

                youtubeTab.location.href=
                    data.url;

                youtubeTab.focus();

            }

            status.textContent="Playing";

        }catch(error){

            console.error(error);

            status.textContent=
                "Server connection failed";

        }

    };

    mic.onclick=()=>{

        if(listening)
            return;

        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    };

}

</script>

</body>
</html>
